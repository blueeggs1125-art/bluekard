  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background-color: #f5f5f5;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      animation: pageSlideIn 0.4s ease-out forwards;
      opacity: 0;
    }

    @keyframes pageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #333;
    }

    .profile-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-bottom: 20px;
      max-width: 350px;
      margin: 20px auto;
      text-align: center;
    }

    .user-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 15px;
      display: block;
      object-fit: cover;
    }

    .default-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 15px;
      display: block;
      background-color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: #999;
    }

    .user-details {
      margin-bottom: 20px;
    }

    .user-details p {
      margin: 10px 0;
      color: #555;
      font-size: 16px;
    }

    .note {
      font-size: 12px;
      color: #999;
      margin: 15px 0;
    }

    .logout-btn {
      padding: 12px 20px;
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
    }

    .logout-btn:hover {
      background-color: #cc0000;
    }

    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
      font-size: 14px;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #1e90ff;
      text-align: center;
      flex: 1;
      padding: 5px 0;
    }

    .bottom-nav a.active {
      font-weight: bold;
    }

    
    @media (max-width: 768px) {
      .container {
        padding: 0 10px;
      }
      
      h1 {
        font-size: 20px;
      }
      
      h2 {
        font-size: 18px;
      }
      
      .profile-container {
        border-radius: 0;
        padding: 15px;
      }
      
      .bottom-nav {
        padding: 8px 0;
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 5px;
      }
      
      h1 {
        font-size: 18px;
        margin-bottom: 15px;
      }
      
      h2 {
        font-size: 16px;
      }
      
      .profile-container {
        padding: 15px 10px;
      }
      
      .user-avatar, .default-avatar {
        width: 80px;
        height: 80px;
      }
      
      .bottom-nav {
        padding: 6px 0;
        font-size: 12px;
      }
      
      .bottom-nav a {
        padding: 3px 0;
      }
    }
  </style>
</head>
