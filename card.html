
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡组生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }
        
        .selector-group {
            margin-bottom: 30px;
        }
        
        .selector-group h2 {
            margin-bottom: 15px;
            color: #555;
            font-size: 20px;
        }
        
        .icons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }
        
        .icon-item {
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .icon-item.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .icon-item.selected .icon-image {
            border: 3px solid #1e90ff;
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.7);
        }
        
        .icon-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            background: transparent;
            border: 2px solid #333;
            padding: 10px;
            transition: all 0.3s ease;
        }
        
        .icon-name {
            margin-top: 12px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        .countries-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 10px;
        }
        
        .country-item {
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .country-item.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .country-item.selected .country-image {
            border: 3px solid #1e90ff;
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.7);
        }
        
        .country-image {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: transparent;
            border: 2px solid #333;
            padding: 8px;
            transition: all 0.3s ease;
        }
        
        .country-name {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .generate-btn {
            display: block;
            margin: 40px auto;
            padding: 15px 40px;
            background-color: #1e90ff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .generate-btn:hover {
            background-color: #0066cc;
        }
        
        .generate-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        @media (max-width: 768px) {
            .icons-container, .countries-container {
                gap: 15px;
            }
            
            .icon-image {
                width: 80px;
                height: 80px;
            }
            
            .country-image {
                width: 70px;
                height: 70px;
            }
            
            .icon-name, .country-name {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>卡组生成器</h1>
        
        <div class="selector-group">
            <h2>选择主要国家</h2>
            <div class="icons-container" id="main-icons">
            </div>
        </div>
        
        <div class="selector-group">
            <h2>选择次要国家</h2>
            <div class="countries-container" id="country-icons">
            </div>
        </div>
        
        <button class="generate-btn" id="generate-btn" disabled>生成卡组</button>
    </div>
