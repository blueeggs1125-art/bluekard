<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>登录/注册</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background-color: #f5f5f5;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      animation: pageSlideIn 0.4s ease-out forwards;
      opacity: 0;
    }

    @keyframes pageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #333;
    }

    .form-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-bottom: 20px;
      max-width: 350px;
      margin-left: auto;
      margin-right: auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    input, button {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      background-color: white;
      font-size: 16px;
      font-family: Arial, sans-serif;
      margin-bottom: 10px;
    }

    input[type="file"] {
      padding: 5px;
    }

    button {
      padding: 12px 20px;
      background-color: #1e90ff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0066cc;
    }

    .switch-link {
      text-align: center;
      margin-top: 15px;
    }

    .switch-link a {
      cursor: pointer;
      color: #1e90ff;
      text-decoration: none;
      font-weight: bold;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    .user-info {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 350px;
      margin: 0 auto;
      display: none; /* 默认隐藏 */
    }

    .user-info h2 {
      margin-bottom: 15px;
      color: #333;
    }

    .user-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 10px auto;
      display: block;
    }

    .user-details p {
      margin: 5px 0;
      color: #555;
    }

    .no-user {
      text-align: center;
      color: #999;
      font-style: italic;
      padding: 20px;
    }

    .error-message {
      color: #ff0000;
      font-size: 14px;
      margin-top: 5px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 10px;
      color: #666;
    }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
      font-size: 14px;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #1e90ff;
      text-align: center;
      flex: 1;
      padding: 5px 0;
    }

    .bottom-nav a.active {
      font-weight: bold;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .container {
        padding: 0 10px;
      }
      
      h1 {
        font-size: 20px;
      }
      
      h2 {
        font-size: 18px;
      }
      
      .form-container, .user-info {
        border-radius: 0;
        padding: 15px;
      }
      
      .bottom-nav {
        padding: 8px 0;
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 5px;
      }
      
      h1 {
        font-size: 18px;
        margin-bottom: 15px;
      }
      
      h2 {
        font-size: 16px;
      }
      
      .form-container, .user-info {
        padding: 15px 10px;
      }
      
      input, button {
        padding: 8px 10px;
        font-size: 14px;
      }
      
      .user-avatar {
        width: 60px;
        height: 60px;
      }
      
      .bottom-nav {
        padding: 6px 0;
        font-size: 12px;
      }
      
      .bottom-nav a {
        padding: 3px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>用户登录/注册</h1>
    
    <div class="form-container" id="login_form">
      <h2>登录</h2>
      <div class="form-group">
        <label for="login_email">邮箱: *</label>
        <input id="login_email" type="email" placeholder="请输入邮箱" required>
      </div>
      <div class="form-group">
        <label for="login_password">密码: *</label>
        <input id="login_password" type="password" placeholder="请输入密码" required>
      </div>
      <button id="login">登录</button>
      <div class="switch-link">
        <p>没有账户？<a id="to_register">点击注册</a></p>
      </div>
    </div>

    <div class="form-container" id="register_form" style="display:none;">
      <h2>注册</h2>
      <div class="form-group">
        <label for="reg_name">用户名: *</label>
        <input id="reg_name" placeholder="请输入用户名" required>
      </div>
      <div class="form-group">
        <label for="reg_email">邮箱: *</label>
        <input id="reg_email" type="email" placeholder="请输入邮箱" required>
      </div>
      <div class="form-group">
        <label for="reg_password">密码: *</label>
        <input id="reg_password" type="password" placeholder="请输入密码" required>
      </div>
      <div class="form-group">
        <label for="reg_avatar">头像 (可选):</label>
        <input type="file" id="reg_avatar" accept="image/*">
      </div>
      <button id="register">注册</button>
      <div class="switch-link">
        <p>已有账户？<a id="to_login">返回登录</a></p>
      </div>
    </div>

    <div class="user-info" id="user_info">
      <h2>当前用户</h2>
      <div id="current_user">
        <div class="no-user">请登录或注册</div>
      </div>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <div class="bottom-nav">
    <a href="index.html">卡图</a>

    <a href="suck.html">音效库</a>

  </div>
