            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;

        .container {

            padding: 20px;

            overflow: hidden;
        }

 .image-link-container {

}

        .content-image {
            height: 80%;
            width: auto;
            max-width: 250px;
            border-radius: 10px;
            filter: drop-shadow(0 0 10px rgba(30, 144, 255, 0.8));
            object-fit: contain;
            margin-right: 20px;
            margin-bottom: 15px; 
        }

        .text-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left; 
            width: 100%;
            max-width: calc(100% - 270px);

        .content-link {

            margin-bottom: 10px;

        .content-link:hover {

        }

            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            word-wrap: break-word; /* 允许长单词换行 */
        }

        .normal-text {
            font-size: 16px;
            font-weight: normal;
            color: #555;
            word-wrap: break-word; /* 允许长单词换行 */
        }
