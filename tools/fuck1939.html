<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放页面</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;}
.img-container{width:100%;height:auto;position:relative;}
@media(min-width:768px){
.img-container{height:100vh;background:url('1939.jpg') no-repeat center center;background-size:cover;}
.mobile-img{display:none;}
}
@media(max-width:767px){
.mobile-img{width:100%;height:auto;display:block;object-fit:contain;}
}
.control-area{width:100%;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:15px;}

.guide-text{font-size:18px;color:#333;margin-bottom:10px;text-align:center;line-height:1.5;}
.btn-group{display:flex;gap:10px;z-index:10;}
.btn{padding:10px 20px;font-size:16px;cursor:pointer;background-color:#007bff;color:white;border:none;border-radius:4px;transition:background-color 0.3s;}
.btn:hover{background-color:#0056b3;}
.text-display{font-size:24px;color:red;font-weight:bold;display:none;text-align:center;z-index:10;}

.footer-text{font-size:12px;color:#666;margin-top:15px;text-align:center;}
.footer-text a{color:#007bff;text-decoration:none;}
.footer-text a:hover{text-decoration:underline;}
.video-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;display:none;}
.video-container video{width:100%;height:100%;object-fit:cover;outline:none;}
</style>
</head>
<body>
<div class="img-container" id="imgContainer">
<img src="1939.jpg" alt="背景图" class="mobile-img">
<div class="video-container" id="videoContainer">
<video id="videoPlayer" playsinline webkit-playsinline></video>
</div>
</div>
<div class="control-area">
<div class="guide-text">冰岛人和无辜路人被绑到铁路上了，你选择救谁？</div>
<div class="btn-group">
<button class="btn" id="btn1939">碾死冰岛人</button>
<button class="btn" id="btnSLR">碾死无辜路人</button>
</div>
<div class="text-display" id="textDisplay"></div>
<div class="footer-text">本页面未公开，你可能要通过直连进入 <a href="https://www.fk1939.cn" target="_blank">主页面</a></div>
</div>
<script>
const btn1939 = document.getElementById('btn1939');
const btnSLR = document.getElementById('btnSLR');
const textDisplay = document.getElementById('textDisplay');
const videoContainer = document.getElementById('videoContainer');
const videoPlayer = document.getElementById('videoPlayer');
const imgContainer = document.getElementById('imgContainer');
const mobileImg = document.querySelector('.mobile-img');

let imgClickCount = 0;
const imgNeedClick = 3;

function adjustVideoSize(){
if(window.innerWidth <= 767){
const imgRect = mobileImg.getBoundingClientRect();
videoContainer.style.width = imgRect.width + 'px';
videoContainer.style.height = imgRect.height + 'px';
videoContainer.style.top = imgRect.top + 'px';
videoContainer.style.left = imgRect.left + 'px';
}else{
const containerRect = imgContainer.getBoundingClientRect();
videoContainer.style.width = containerRect.width + 'px';
videoContainer.style.height = containerRect.height + 'px';
videoContainer.style.top = 0;
videoContainer.style.left = 0;
}
}

function stopVideo(){
videoPlayer.pause();
videoPlayer.src = '';
videoContainer.style.display = 'none';
textDisplay.style.display = 'none';
}

function playVideo(src, txt){
stopVideo();
adjustVideoSize();
textDisplay.textContent = txt;
textDisplay.style.display = 'block';
videoPlayer.src = src;
videoPlayer.controls = false;
videoContainer.style.display = 'block';
videoPlayer.play().catch(err=>{});
videoPlayer.onended = stopVideo;
}


btn1939.addEventListener('click', function(){
playVideo('die1939.mp4', '结局：脱离苦海 ');
});


btnSLR.addEventListener('click', function(){
playVideo('dieman.mp4', '结局：罪恶滔天 ');
});

imgContainer.addEventListener('click', function(){
imgClickCount++;
if(imgClickCount >= imgNeedClick){
playVideo('fk1939.mp4', '结局：来日再会');
imgClickCount = 0;
}
});

window.addEventListener('resize', adjustVideoSize);
</script>
</body>
</html>
