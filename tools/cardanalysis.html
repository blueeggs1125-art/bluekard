<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/cardanalysis/cardanalysis.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡组代码解析器</title>
    <style>

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .code-input {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .parse-btn {
            padding: 12px 30px;
            background-color: #1e90ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }

        .save-btn {
            padding: 12px 30px;
            background-color: #28a745;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .parse-btn:hover {
            background-color: #0066cc;
        }

        .save-btn:hover {
            background-color: #218838;
        }


        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .preview-title {
            font-size: 20px;
            font-weight: bold;
            color: #555;
        }

        .visual-representation {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }




        .card-images-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0;
            margin-top: 15px;
        }

        .card-image-container {
            text-align: center;
            margin: 0;
            padding: 5px;
        }

        .card-image {
            width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card-name {
            margin-top: 5px;
            font-size: 12px;
            word-break: break-word;
        }

        .command-point {
            font-weight: bold;
            color: #28a745;
        }

    </style>
</head>
<body>
    <div class="container">

        
        <div class="input-section">
            <input type="text" class="code-input" id="code-input" placeholder="请输入卡组代码">
            <br>

<button class="parse-btn" id="parse-btn" style="
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4); /* 文字阴影更突出 */
    height: 55px;
    padding: 0 15px;
    border-radius: 12px;
    transition: transform 0.25s cubic-bezier(0.22,1,0.36,1), background-color 0.2s ease, box-shadow 0.2s ease;
    background: linear-gradient(145deg, rgba(30,144,255,0.85), rgba(222, 223, 224, 0.85)); /* 背景渐变更亮 */
    border: none;
    cursor: pointer;
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
    box-shadow: 0 6px 20px rgba(30,144,255,0.45); /* 增加阴影更浮 */
    margin-right: 10px;
    min-width: 120px;
" 
onmouseover="this.style.background='linear-gradient(145deg, rgba(30,144,255,0.95), rgba(70,180,255,0.95))'; this.style.boxShadow='0 6px 25px rgba(30,144,255,0.6)';" 
onmouseout="this.style.background='linear-gradient(145deg, rgba(30,144,255,0.85), rgba(70,180,255,0.85))'; this.style.boxShadow='0 6px 20px rgba(30,144,255,0.45)';"
onmousedown="this.style.transform='scale(0.92)';"
onmouseup="this.style.transform='scale(1)';">
解析代码
</button>

<button class="save-btn" id="save-btn" style="
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    height: 55px;
    padding: 0 15px;
    border-radius: 12px;
    transition: transform 0.25s cubic-bezier(0.22,1,0.36,1), background-color 0.2s ease, box-shadow 0.2s ease;
    background: linear-gradient(145deg, rgba(40,167,69,0.85), rgba(214, 218, 214, 0.85));
    border: none;
    cursor: pointer;
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
    box-shadow: 0 6px 20px rgba(40,167,69,0.45);
    margin-right: 10px;
    min-width: 120px;
    display: none;
" 
onmouseover="this.style.background='linear-gradient(145deg, rgba(40,167,69,0.95), rgba(80,200,100,0.95))'; this.style.boxShadow='0 6px 25px rgba(40,167,69,0.6)';" 
onmouseout="this.style.background='linear-gradient(145deg, rgba(40,167,69,0.85), rgba(80,200,100,0.85))'; this.style.boxShadow='0 6px 20px rgba(40,167,69,0.45)';"
onmousedown="this.style.transform='scale(0.92)';"
onmouseup="this.style.transform='scale(1)';">
保存图片
</button>

        </div>
        
        <div class="deck-preview" id="deck-preview">
            <div class="preview-header">
                <div class="preview-title">卡组预览</div>
            </div>
            
            <div class="visual-representation" id="visual-representation">
                <!-- 稀有度区域将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>
        <script src="../js/daohanglan.js"></script>

<script>
let parsedDeck = null;
let cardData = null;
let imageData = null;

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('parse-btn').addEventListener('click', parseDeckCode);
    document.getElementById('save-btn').addEventListener('click', saveImages);
    
    loadCardData();
});

async function loadCardData() {
    try {
        const response = await fetch('../data/newk.json');
        cardData = await response.json();
        
        const imageResponse = await fetch('../data/newimages.json');
        imageData = await imageResponse.json();
    } catch (error) {
        console.error('加载数据失败:', error);
    }
}

function parseDeckCode() {
    const codeInput = document.getElementById('code-input');
    const code = codeInput.value.trim();
    
    if (!code) {
        alert('请输入卡组代码');
        return;
    }
    
    try {
        if (!code.startsWith('%%')) {
            throw new Error('无效的卡组代码格式');
        }
        
        const parts = code.substring(2).split('|');
        if (parts.length !== 2) {
            throw new Error('无效的卡组代码格式');
        }
        
        const deckPart = parts[1];
        const sections = deckPart.split(';');
        if (sections.length !== 4) {
            throw new Error('无效的卡组代码格式');
        }
        
        const oneCardCodes = sections[0] ? parseCardSection(sections[0]) : [];
        const twoCardCodes = sections[1] ? parseCardSection(sections[1]) : [];
        const threeCardCodes = sections[2] ? parseCardSection(sections[2]) : [];
        const fourCardCodes = sections[3] ? parseCardSection(sections[3]) : [];
        
        parsedDeck = {
            one: oneCardCodes,
            two: twoCardCodes,
            three: threeCardCodes,
            four: fourCardCodes
        };
        
        displayVisualPreview();
        
        document.getElementById('deck-preview').style.display = 'block';
        document.getElementById('save-btn').style.display = 'inline-block';
    } catch (error) {
        alert('解析失败: ' + error.message);
    }
}

function parseCardSection(section) {
    const cards = [];
    
    for (let i = 0; i < section.length; i += 2) {
        const code = section.substring(i, i + 2);
        if (code.length === 2) {
            cards.push(code);
        }
    }
    
    return cards;
}

function displayVisualPreview() {
    const container = document.getElementById('visual-representation');
    container.innerHTML = '';
    
    const rarityGroups = {};
    
    const countMap = {
        'one': 1,
        'two': 2,
        'three': 3,
        'four': 4
    };
    
    Object.keys(parsedDeck).forEach(category => {
        const count = countMap[category];
        parsedDeck[category].forEach(code => {
            const cardInfo = findCardByCode(code);
            if (cardInfo && cardInfo.详细信息 && cardInfo.详细信息["稀有度"]) {
                const rarity = cardInfo.详细信息["稀有度"];
                if (!rarityGroups[rarity]) {
                    rarityGroups[rarity] = [];
                }
                for (let i = 0; i < count; i++) {
                    rarityGroups[rarity].push(code);
                }
            }
        });
    });
    
    Object.keys(rarityGroups).forEach(rarity => {
        const cards = rarityGroups[rarity];
        
        const section = document.createElement('div');
        section.className = 'rarity-section';
        
        const cardCounts = {};
        cards.forEach(code => {
            cardCounts[code] = (cardCounts[code] || 0) + 1;
        });
        
        section.innerHTML = `
            <div class="rarity-header">
                <div class="rarity-name">${rarity}</div>
                <div class="rarity-count">${Object.keys(cardCounts).length} 种</div>
            </div>
            <div class="card-images-container" id="card-images-${rarity}">
            </div>
        `;
        
        container.appendChild(section);
        
        showCardImagesForRarity(rarity, cards);
    });
}

function showCardImagesForRarity(rarityKey, cardCodes) {
    const container = document.getElementById(`card-images-${rarityKey}`);
    if (!container) return;
    
    container.innerHTML = '';
    
    // 获取所有卡牌信息并按指挥点排序
    const cardInfoList = [];
    cardCodes.forEach(code => {
        const cardInfo = findCardByCode(code);
        if (cardInfo) {
            cardInfoList.push({
                code: code,
                info: cardInfo,
                commandPoint: parseInt(cardInfo.详细信息?.["指挥点"]) || 0
            });
        }
    });
    
    // 按指挥点排序
    cardInfoList.sort((a, b) => a.commandPoint - b.commandPoint);
    
    // 逐个创建卡牌元素并添加到容器中
    cardInfoList.forEach(cardItem => {
        const cardInfo = cardItem.info;
        const imagePath = findImagePath(cardInfo.名称, cardInfo.国家);
        
        if (imagePath) {
            const cardElement = document.createElement('div');
            cardElement.className = 'card-image-container';
            cardElement.setAttribute('data-card-code', cardItem.code);
            cardElement.setAttribute('data-card-name', cardInfo.名称);
            cardElement.setAttribute('data-command-point', cardItem.commandPoint);
            
cardElement.innerHTML = `
    <div style="position:relative;"> 
        <img src="${encodeImagePath(imagePath)}" alt="${cardInfo.名称}" class="card-image" loading="lazy">
        <div class="card-name">${cardInfo.名称}<br>
            <span class="command-point">指挥点: ${cardItem.commandPoint}</span>
        </div>
    </div>
`;
            
            container.appendChild(cardElement);
        }
    });
}

function findCardByCode(code) {
    if (!cardData) return null;
    
    return cardData.find(card => 
        card.详细信息 && card.详细信息["卡牌代码"] === code
    );
}

function findImagePath(cardName, country) {
    if (!imageData || !imageData[country]) return null;
    
    for (const subtype in imageData[country]) {
        const foundImage = imageData[country][subtype].find(imgPath => 
            imgPath.includes(cardName)
        );
        if (foundImage) {
            return foundImage;
        }
    }
    
    return null;
}

function encodeImagePath(path) {
    // 处理相对路径，确保在 tools 文件夹中正确访问上层目录资源
    if (path.startsWith('../')) {
        // 已经有 ../ 前缀，正常处理
        const parts = path.split('/');
        return parts.map((part, index) => {
            // 第一个部分是 ..，不需要编码
            if (index === 0) return part;
            return encodeURIComponent(part);
        }).join('/');
    } else if (path.startsWith('http')) {
        // 完整URL，直接返回
        return path;
    } else {
        // 添加 ../ 前缀并编码，以便从tools目录访问上层目录
        const parts = path.split('/');
        return '../' + parts.map(part => encodeURIComponent(part)).join('/');
    }
}

function saveImages() {
    // 获取所有显示的卡牌图片并按指挥点排序
    const cardContainers = Array.from(document.querySelectorAll('.card-image-container'));
    
    // 按指挥点排序
    cardContainers.sort((a, b) => {
        const pointA = parseInt(a.getAttribute('data-command-point')) || 0;
        const pointB = parseInt(b.getAttribute('data-command-point')) || 0;
        return pointA - pointB;
    });
    
    // 创建一个隐藏的canvas元素
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none'; // 确保隐藏
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    
    // 设置每张图片的尺寸
    const imgWidth = 200;
    const imgHeight = 300;
    const imagesPerRow = 5;
    
    // 计算canvas尺寸
    const rows = Math.ceil(cardContainers.length / imagesPerRow);
    canvas.width = imgWidth * imagesPerRow;
    canvas.height = imgHeight * rows;
    
    // 填充白色背景
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 加载并绘制所有图片
    let loadedImages = 0;
    const totalImages = cardContainers.length;
    
    if (totalImages === 0) {
        alert('没有可保存的图片');
        document.body.removeChild(canvas);
        return;
    }
    
    cardContainers.forEach((container, index) => {
        const img = container.querySelector('.card-image');
        if (img && img.complete && img.naturalHeight !== 0) { // 检查图片是否已加载
            try {
                const row = Math.floor(index / imagesPerRow);
                const col = index % imagesPerRow;
                
                ctx.drawImage(
                    img,
                    col * imgWidth,
                    row * imgHeight,
                    imgWidth,
                    imgHeight
                );
                
                loadedImages++;
                if (loadedImages === totalImages) {
                    downloadCanvas(canvas);
                }
            } catch (e) {
                console.error('绘制图片出错:', e);
                loadedImages++;
                if (loadedImages === totalImages) {
                    downloadCanvas(canvas);
                }
            }
        } else {
            loadedImages++;
            if (loadedImages === totalImages) {
                downloadCanvas(canvas);
            }
        }
    });
    
    // 如果所有图片都立即处理完毕但仍为0，则执行下载
    if (totalImages > 0 && loadedImages === totalImages) {
        downloadCanvas(canvas);
    }
}

function downloadCanvas(canvas) {
    try {
        const link = document.createElement('a');
        link.download = '卡组图片_' + new Date().getTime() + '.png';
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    } catch (e) {
        console.error('下载图片失败:', e);
        alert('图片生成完成，但由于浏览器安全限制无法自动下载。请右键点击下方图片并选择"另存为"来保存。');
        
        // 在新窗口中显示图片
        const newWindow = window.open('', '_blank');
        newWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>卡组图片</title>
            </head>
            <body style="margin:0;padding:20px;background:#f0f0f0;">
                <h2>右键点击图片并选择"另存为"来保存</h2>
                <img src="${canvas.toDataURL('image/png')}" style="max-width:100%;height:auto;" />
            </body>
            </html>
        `);
    }
    
    // 移除临时canvas
    document.body.removeChild(canvas);
}
</script>
</body>
</html>
