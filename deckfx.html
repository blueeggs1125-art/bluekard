<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>留言测试</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background-color: #f5f5f5;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      animation: pageSlideIn 0.4s ease-out forwards;
      opacity: 0;
    }

    @keyframes pageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
    }

    .message-form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      background-color: white;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      padding: 12px 20px;
      background-color: #1e90ff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      width: 100%;
    }

    button:hover {
      background-color: #0066cc;
    }

    .messages-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .messages-header {
      padding: 15px 20px;
      background-color: #1e90ff;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    .message-list {
      padding: 0 20px;
    }

    .message-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .message-item:last-child {
      border-bottom: none;
    }

    .message-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
      object-fit: cover;
    }

    .default-avatar-small {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
      background-color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #999;
    }

    .message-user-info {
      flex: 1;
    }

    .message-user {
      font-weight: bold;
      color: #333;
    }

    .message-time {
      color: #999;
      font-size: 0.85em;
      margin-left: 5px;
    }

    .message-content {
      color: #555;
      line-height: 1.5;
      /* 添加以下属性以支持换行 */
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-left: 50px;
    }

    .reply-section {
      margin-top: 15px;
      margin-left: 50px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .reply-header {
      font-weight: bold;
      color: #1e90ff;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .reply-item {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #eee;
    }

    .reply-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .reply-header-info {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    .reply-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin-right: 8px;
      object-fit: cover;
    }

    .default-avatar-tiny {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin-right: 8px;
      background-color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #999;
    }

    .reply-user {
      font-weight: bold;
      color: #333;
      font-size: 13px;
    }

    .reply-time {
      color: #999;
      font-size: 12px;
      margin-left: 5px;
    }

    .reply-content {
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      margin-left: 38px;
    }

    .reply-form {
      margin-top: 15px;
      display: none;
    }

    .reply-form.active {
      display: block;
    }

    .reply-form textarea {
      min-height: 60px;
      font-size: 14px;
      padding: 8px;
    }

    .reply-form button {
      width: auto;
      padding: 8px 15px;
      font-size: 14px;
      margin-top: 5px;
    }

    .reply-toggle {
      color: #1e90ff;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      display: inline-block;
    }

    .reply-toggle:hover {
      text-decoration: underline;
    }

    .pagination {
      display: flex;
      justify-content: center;
      padding: 20px;
      gap: 5px;
      flex-wrap: wrap;
    }

    .pagination button {
      width: auto;
      padding: 8px 15px;
      background-color: #f0f0f0;
      color: #333;
      border: 1px solid #ddd;
    }

    .pagination button:hover:not(.active) {
      background-color: #e0e0e0;
    }

    .pagination button.active {
      background-color: #1e90ff;
      color: white;
      border-color: #1e90ff;
    }

    .pagination button:first-child,
    .pagination button:last-child {
      background-color: #1e90ff;
      color: white;
      border-color: #1e90ff;
    }

    .pagination .page-info {
      display: flex;
      align-items: center;
      color: #555;
      font-size: 14px;
      margin: 0 10px;
    }

    .no-messages {
      text-align: center;
      padding: 40px 20px;
      color: #999;
      font-style: italic;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .login-prompt {
      text-align: center;
      padding: 15px;
      background-color: #e8f4ff;
      border-radius: 5px;
      margin-bottom: 15px;
      color: #1e90ff;
    }

    .login-prompt a {
      color: #1e90ff;
      font-weight: bold;
      text-decoration: none;
    }

    .login-prompt a:hover {
      text-decoration: underline;
    }

    .user-display {
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
      font-size: 14px;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #1e90ff;
      text-align: center;
    }

    .bottom-nav a.active {
      font-weight: bold;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .container {
        padding: 0 10px;
      }
      
      h1 {
        font-size: 20px;
      }
      
      .message-form, .messages-container {
        border-radius: 0;
      }
      
      .message-form {
        padding: 15px;
      }
      
      .message-header {
        margin-bottom: 5px;
      }
      
      .message-avatar, .default-avatar-small {
        width: 35px;
        height: 35px;
        font-size: 16px;
        margin-right: 8px;
      }
      
      .message-content, .reply-section {
        margin-left: 43px;
      }
      
      .reply-avatar, .default-avatar-tiny {
        width: 25px;
        height: 25px;
        font-size: 12px;
        margin-right: 6px;
      }
      
      .reply-content {
        margin-left: 31px;
      }
      
      .pagination {
        gap: 3px;
        padding: 15px 5px;
      }
      
      .pagination button {
        padding: 6px 10px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 18px;
      }
      
      .messages-header {
        font-size: 16px;
        padding: 12px 15px;
      }
      
      .message-item {
        padding: 12px 0;
      }
      
      .message-user {
        font-size: 14px;
      }
      
      .message-content {
        font-size: 14px;
      }
      
      .reply-user {
        font-size: 12px;
      }
      
      .reply-content {
        font-size: 12px;
      }
      
      .pagination {
        padding: 10px 5px;
      }
      
      .pagination button {
        padding: 5px 8px;
        font-size: 12px;
      }
      
      .pagination .page-info {
        font-size: 12px;
        margin: 0 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>留言板</h1>
    
    <div class="message-form">
      <div id="loginInfo"></div>
      <div id="userDisplay" class="user-display" style="display: none;"></div>
      <div class="form-group">
        <label for="msg">留言内容:</label>
        <textarea id="msg" placeholder="输入留言内容"></textarea>

      <button id="send">发送留言</button>
    </div>

    <div class="messages-container">
      <div class="messages-header">所有留言</div>
      <div class="message-list" id="list">
        <div class="loading">加载中...</div>
      </div>
      <div class="pagination" id="pagination">

      </div>
    </div>
  </div>


  <div class="bottom-nav">

        <a href="meie.html" class="nav-link">我的</a>

  </div>
