function loadInitialImages() {
    imageDisplay.innerHTML = '<div class="loading">加载中...</div>';

        fetch('data/newimages.json').then(response => response.json())
    ])
    .then(([cardsData, imagesData]) => {
        
        const cardImageMap = createCardImageMap(cardsData, imagesData);
        
        
        const sortedCards = sortCardsByCommandPoint(cardImageMap);
        
        
        const allImages = sortedCards.map(item => ({
            path: item.imagePath,
            name: item.imagePath.split('/').pop(),
            cardData: item.card 
        }));
        
        renderImages(allImages);
    })
    .catch(error => {
        console.error('加载图片出错:', error);
        imageDisplay.innerHTML = '<div class="no-images">加载图片失败</div>';
    });
}

    
    
    function createCardImageMap(cardsData, imagesData) {
        const cardImageMap = [];
        
        
        cardsData.forEach(card => {
            const country = card.国家;
            const cardName = card.名称;
            
            
            if (imagesData[country]) {
                for (const subtype in imagesData[country]) {
                    const foundImage = imagesData[country][subtype].find(imgPath => 
                        imgPath.includes(cardName)
                    );
                    if (foundImage) {
                        cardImageMap.push({
                            card: card,
                            imagePath: foundImage
                        });
                        break;
                    }
                }
            }
        });
        
        return cardImageMap;
    }
    
    
    function sortCardsByCommandPoint(cards) {
        return cards.sort((a, b) => {
            const cpA = parseInt(a.card.详细信息?.["指挥点"]) || 0;
            const cpB = parseInt(b.card.详细信息?.["指挥点"]) || 0;
            return cpA - cpB;
        });
    }
    
    
    function updateFilter(type, value) {
        let selectElement;
        switch(type) {
            case 'country':
                selectElement = document.getElementById('country-select');
                break;
            case 'rarity':
                selectElement = document.getElementById('rarity-select');
                break;
            case 'type':
                selectElement = document.getElementById('type-select');
                break;
            case 'command-point':
                selectElement = document.getElementById('command-point-select');
                break;
            case 'status':
                selectElement = document.getElementById('status-select');
                break;
            case 'setting':
                selectElement = document.getElementById('setting-select');
                break;
        }
        
        if (selectElement) {
            
            const currentValues = selectElement.value ? selectElement.value.split(',') : [];
            const valueIndex = currentValues.indexOf(value);
            
            if (valueIndex > -1) {
                
                currentValues.splice(valueIndex, 1);
            } else {
                
                currentValues.push(value);
            }
            
            selectElement.value = currentValues.join(',');
            
            
            syncMobileFilters(type, selectElement.value);
        }
    }
    
    
    function applyFilters() {
        const filters = {
            country: countrySelect.value ? countrySelect.value.split(',') : [],
            rarity: raritySelect.value ? raritySelect.value.split(',') : [],
            type: typeSelect.value ? typeSelect.value.split(',') : [],
            commandPoint: commandPointSelect.value ? commandPointSelect.value.split(',') : [],
            status: statusSelect.value ? statusSelect.value.split(',') : [],
            setting: settingSelect.value ? settingSelect.value.split(',') : [],
            special: specialSelect.value,
            search: searchInput.value.trim().toLowerCase()
        };
        
        if (filters.special) {
            displaySpecialImages(filters.special);
        } else if (hasActiveFilters(filters)) {
            displayFilteredImages(filters);
        } else {
            
            loadInitialImages();
        }
    }
    
    
    function hasActiveFilters(filters) {
        return filters.country.length > 0 || filters.rarity.length > 0 || filters.type.length > 0 || 
               filters.commandPoint.length > 0 || filters.status.length > 0 || filters.setting.length > 0 || 
               filters.search;
    }
    
    
    function displaySpecialImages(category) {
        imageDisplay.innerHTML = '<div class="loading">加载中...</div>';
        
        fetch('data/newimages.json')
            .then(response => response.json())
            .then(imagesData => {
                if (imagesData[category] && Array.isArray(imagesData[category])) {
                    const imagePaths = imagesData[category].map(imgPath => ({
                        path: imgPath,
                        name: imgPath.split('/').pop()
                    }));
                    renderImages(imagePaths);

                    imageDisplay.innerHTML = '<div class="no-images">未找到相关图片</div>';

            .catch(error => {
                console.error('加载图片出错:', error);
                imageDisplay.innerHTML = '<div class="no-images">加载图片失败</div>';

    }
    
    
function displayFilteredImages(filters) {
    imageDisplay.innerHTML = '<div class="loading">加载中...</div>';
    
    
    Promise.all([
        fetch('data/newk.json').then(response => response.json()),
        fetch('data/newimages.json').then(response => response.json())
    ])
    .then(([cardsData, imagesData]) => {
        
        let filteredCards = cardsData;
        
        
        if (filters.country.length > 0) {
            filteredCards = filteredCards.filter(card => 
                filters.country.includes(card.国家)
            );
        }
        
        
        if (filters.rarity.length > 0) {
            filteredCards = filteredCards.filter(card => 
                filters.rarity.includes(card.详细信息?.稀有度)
            );
        }
        
        
        if (filters.type.length > 0) {
            filteredCards = filteredCards.filter(card => 
                filters.type.includes(card.详细信息?.类型)
            );
        }
        
        
        if (filters.commandPoint.length > 0) {
            filteredCards = filteredCards.filter(card => {
                const commandPoint = card.详细信息?.["指挥点"];
                if (filters.commandPoint.includes("7+")) {
                    if (parseInt(commandPoint) >= 7) {
                        return true;
                    }
                }
                return filters.commandPoint.includes(commandPoint);
            });
        }
        
        
        if (filters.status.length > 0) {
            filteredCards = filteredCards.filter(card => {
                const isActive = card.详细信息?.活跃 === true || card.详细信息?.活跃 === "true";
                const statusStr = isActive ? "true" : "false";
                return filters.status.includes(statusStr);
            });
        }
        
        
        if (filters.setting.length > 0) {
            filteredCards = filteredCards.filter(card => 
                filters.setting.includes(card.详细信息?.设置)
            );
        }
        
        
        if (filters.search) {
            filteredCards = filteredCards.filter(card => 
                card.名称.toLowerCase().includes(filters.search) ||
                (card.描述 && card.描述.toLowerCase().includes(filters.search))
            );
        }
        
        
        const cardImageMap = createCardImageMap(filteredCards, imagesData);
        
        
        const sortedCards = sortCardsByCommandPoint(cardImageMap);
        
        
        const filteredImages = sortedCards.map(item => ({
            path: item.imagePath,
            name: item.imagePath.split('/').pop(),
            cardData: item.card 
        }));
        
        if (filteredImages.length === 0) {
            imageDisplay.innerHTML = '<div class="no-images">未找到匹配的图片</div>';
        } else {
            renderImages(filteredImages);
        }
    })
    .catch(error => {
        console.error('加载图片出错:', error);
        imageDisplay.innerHTML = '<div class="no-images">加载图片失败</div>';
    });
}

    
    
function renderImages(images) {
    let html = '<div class="image-container">';
    images.forEach(image => {
        const imagePath = typeof image === 'object' ? image.path : image;
        const encodedImagePath = encodeImagePath(imagePath);
        const fileName = imagePath.split('/').pop();
        const displayName = typeof image === 'object' ? (image.name || fileName) : fileName;
        const encodedFileName = encodeURIComponent(fileName);
        
        
        let isReserve = false;
        if (image.cardData) {
            isReserve = image.cardData.详细信息?.活跃 === "false";
        }
        
        html += `
            <div class="image-item">
                <img src="${encodedImagePath}" alt="${displayName}" 
                     data-url="${encodedImagePath}"
                     data-filename="${encodedFileName}"
                     onload="this.parentNode.classList.add('loaded')">
                ${isReserve ? `<img 
                    src="image/T_nui-icon-Reserves-gritty-256.png" 
                    alt="预备" 
                    class="reserve-icon"
                >` : ''}
                <div class="image-name">${displayName}</div>
            </div>
        `;
    });
    html += '</div>';
    
    imageDisplay.innerHTML = html;
    
    
    document.querySelectorAll('.image-item img').forEach(img => {
        
        if (!img.classList.contains('reserve-icon')) {
            new ImageTouchHandler(img);
        }
    });
}
    
    
    const mobileFilterBtn = document.getElementById('mobile-filter-btn');
    const mobileFilterOverlay = document.getElementById('mobile-filter-overlay');
    const mobileFilterTooltip = document.getElementById('mobile-filter-tooltip');
    const closeMobileTooltip = document.getElementById('close-mobile-tooltip');
    
    
    mobileFilterBtn.addEventListener('click', function() {

    document.querySelectorAll('.tooltip-option').forEach(option => {

            if (type === 'country' && (value === '总部' || value === '卡背')) {
                
                document.querySelectorAll('.tooltip-option').forEach(opt => {

                this.classList.add('selected');
                
                
                displaySpecialImages(value);
                return;

            this.classList.toggle('selected');
            
            
            applyMobileFilter();
        });

 function filterImagesByMobile(filters) {
    imageDisplay.innerHTML = '<div class="loading">加载中...</div>';
    
    
    Promise.all([
        fetch('data/newk.json').then(response => response.json()),
        fetch('data/newimages.json').then(response => response.json())
    ])
    .then(([cardsData, imagesData]) => {
        
        let filteredCards = cardsData;
        
        
        if (filters.country.length > 0) {
            filteredCards = filteredCards.filter(card => 
                filters.country.includes(card.国家)
            );
        }
        
        
        if (filters.rarity.length > 0) {
            filteredCards = filteredCards.filter(card => 
                filters.rarity.includes(card.详细信息?.稀有度)
            );
        }
        
        
        if (filters.type.length > 0) {
            filteredCards = filteredCards.filter(card => 
                filters.type.includes(card.详细信息?.类型)
            );
        }
        
        
        if (filters.commandPoint.length > 0) {
            filteredCards = filteredCards.filter(card => {
                const commandPoint = card.详细信息?.["指挥点"];
                if (filters.commandPoint.includes("7+")) {
                    if (parseInt(commandPoint) >= 7) {
                        return true;
                    }
                }
                return filters.commandPoint.includes(commandPoint);
            });
        }
        
        
        if (filters.status.length > 0) {
            filteredCards = filteredCards.filter(card => {
                const isActive = card.详细信息?.活跃 === true || card.详细信息?.活跃 === "true";
                const statusStr = isActive ? "true" : "false";
                return filters.status.includes(statusStr);
            });
        }
        
        
        if (filters.setting.length > 0) {
            filteredCards = filteredCards.filter(card => 
                filters.setting.includes(card.详细信息?.设置)
            );
        }
        
        
        if (filters.search) {
            filteredCards = filteredCards.filter(card => {
                
                const nameMatch = card.名称.toLowerCase().includes(filters.search);
                const descMatch = card.描述 && card.描述.toLowerCase().includes(filters.search);
                
                
                let fileNameMatch = false;
                const country = card.国家;
                const cardName = card.名称;
                
                if (imagesData[country]) {
                    for (const subtype in imagesData[country]) {
                        const foundImage = imagesData[country][subtype].find(imgPath => 
                            imgPath.includes(cardName)
                        );
                        if (foundImage) {
                            const fileName = foundImage.split('/').pop().toLowerCase();
                            fileNameMatch = fileName.includes(filters.search);
                            break;
                        }
                    }
                }
                
                return nameMatch || descMatch || fileNameMatch;
            });
        }
        
        
        const cardImageMap = createCardImageMap(filteredCards, imagesData);
        
        
        const sortedCards = sortCardsByCommandPoint(cardImageMap);
        
        
        const filteredImages = sortedCards.map(item => ({

    function syncMobileFilters(type, value) {
        
        document.querySelectorAll(`.tooltip-option[data-type="${type}"]`).forEach(opt => {
            opt.classList.remove('selected');
        });
        
        if (value) {
            const values = value.split(',');
            values.forEach(val => {
                const selectedOption = document.querySelector(`.tooltip-option[data-type="${type}"][data-value="${val}"]`);
                if (selectedOption) {
                    selectedOption.classList.add('selected');
                }
            });
        }
    }
    
    
    class ImageTouchHandler {
        constructor(element) {
            this.element = element;
            this.touchStartTime = 0;
            this.touchTimer = null;
            this.touchHandled = false;
            
            this.init();
        }
        
        init() {
            this.element.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
            this.element.addEventListener('touchend', (e) => this.handleTouchEnd(e), { passive: false });
            this.element.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
            this.element.addEventListener('contextmenu', (e) => this.handleContextMenu(e));
        }
        
        handleTouchStart(event) {
            this.touchStartTime = Date.now();
            this.touchHandled = false;
            clearTimeout(this.touchTimer);
            
            this.touchTimer = setTimeout(() => {
                if (!this.touchHandled) {
                    this.downloadImage();
                    this.touchHandled = true;
                }
            }, 800);
        }
        
        handleTouchMove(event) {
            clearTimeout(this.touchTimer);
            this.touchHandled = true;
        }
        
        handleTouchEnd(event) {
            clearTimeout(this.touchTimer);
            this.touchHandled = true;
        }
        
        handleContextMenu(event) {
            event.preventDefault();
            this.downloadImage();
        }
        
        downloadImage() {
            const url = this.element.dataset.url;
            const filename = decodeURIComponent(this.element.dataset.filename);
            
            if (url.endsWith('.avif')) {
                this.convertAndDownloadAvif(url, filename);
            } else {
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
        
        convertAndDownloadAvif(avifUrl, originalFilename) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                canvas.toBlob(function(blob) {
                    const pngUrl = URL.createObjectURL(blob);
                    const pngFilename = originalFilename.replace('.avif', '.png');
                    
                    const link = document.createElement('a');
                    link.href = pngUrl;
                    link.download = pngFilename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    URL.revokeObjectURL(pngUrl);
                }, 'image/png');
            };
            
            img.src = avifUrl;
        }
    }
    
    
    function encodeImagePath(path) {
        
        return path.split('/').map(part => encodeURIComponent(part)).join('/');
    }
});
