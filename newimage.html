    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }
        
        .selector-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background-color: white;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .image-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        
        .image-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background-color: white;
            aspect-ratio: 2/3; 
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-touch-callout: default;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .image-item .image-name {
            padding: 5px;
            font-size: 11px;
            text-align: center;
            background-color: rgba(0,0,0,0.8);
            color: white;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .no-images {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-style: italic;
            grid-column: 1 / -1;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            grid-column: 1 / -1;
        }
        
        /* 添加导航链接样式 */
        .nav-link {
            display: block;
            text-align: center;
            margin: 15px 0;
            color: #1e90ff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .nav-link:hover {
            text-decoration: underline;
        }
        
        /* 统一的页面载入动画 */
        @keyframes pageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 应用到所有页面容器 */
        .container {
            animation: pageSlideIn 0.4s ease-out forwards;
        }

        /* 为已有动画的页面调整动画 */
        .content {
            animation: pageSlideIn 0.4s ease-out forwards;
        }

        /* 视频列表动画 */
        .video-list {
            animation: pageSlideIn 0.4s ease-out forwards;
        }

        /* 音效容器动画 */
        #sound-display {
            animation: pageSlideIn 0.4s ease-out forwards;
        }

        /* 图片容器动画 */
        #image-display {
            animation: pageSlideIn 0.4s ease-out forwards;
        }

        /* 导航栏动画 */
        .bottom-nav {
            animation: pageSlideIn 0.4s ease-out 0.1s forwards;
            animation-fill-mode: both;
        }

        /* 初始状态设置 */
        .container,
        .content,
        .video-list,
        #sound-display,
        #image-display,
        .bottom-nav {
            opacity: 0;
        }

        /* 延迟显示内容，避免闪烁 */
        @media (prefers-reduced-motion: reduce) {
            .container,
            .content,
            .video-list,
            #sound-display,
            #image-display,
            .bottom-nav {
                animation: none;
                opacity: 1;
            }
        }
        
        /* 在现有样式基础上添加 */
        .container {
            padding-bottom: 60px; /* 为底部导航栏留出空间 */
        }

        /* 底部按钮样式 */
        .bottom-button-container {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 10px 0;
            z-index: 1000;
        }

        .bottom-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1e90ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .bottom-button:hover {
            background-color: #0066cc;
        }
        
        /* 预备图标样式 */
        .image-item .reserve-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            z-index: 10;
        }
        
        /* 移动端筛选按钮 */
        .mobile-filter-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #1e90ff;
            color: white;

            z-index: 1001;
            display: none;
        }
        
        /* 移动端筛选面板 */
        .mobile-filter-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 1002;
            transform: translateY(100%);

            overflow-y: auto;
            padding: 20px;

        }
        
        .mobile-filter-panel.active {
            transform: translateY(0);

        }
        
        .filter-panel-header {

    <script>
        // 移动端筛选功能
 document.addEventListener('DOMContentLoaded', function() {
    const mobileFilterBtn = document.getElementById('mobile-filter-btn');
    const mobileFilterPanel = document.getElementById('mobile-filter-panel');
    const closeFilterPanel = document.getElementById('close-filter-panel');
    
    // 获取移动端筛选元素
    const mobileCountrySelect = document.getElementById('mobile-country-select');
    const mobileRaritySelect = document.getElementById('mobile-rarity-select');
    const mobileTypeSelect = document.getElementById('mobile-type-select');
    const mobileCommandPointSelect = document.getElementById('mobile-command-point-select');
    const mobileStatusSelect = document.getElementById('mobile-status-select');
    const mobileSettingSelect = document.getElementById('mobile-setting-select');
    const mobileSpecialSelect = document.getElementById('mobile-special-select');
    const mobileSearchInput = document.getElementById('mobile-search-input');
    
    // 打开筛选面板
    mobileFilterBtn.addEventListener('click', function() {
        mobileFilterPanel.classList.add('active');
        document.body.style.overflow = 'hidden';
    });
    
    // 关闭筛选面板
    closeFilterPanel.addEventListener('click', function() {
        mobileFilterPanel.classList.remove('active');
        document.body.style.overflow = 'auto';
    });
    
    // 点击面板外部关闭
    mobileFilterPanel.addEventListener('click', function(e) {
        if (e.target === mobileFilterPanel) {
            mobileFilterPanel.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    });
    
    // 为所有移动端筛选器添加事件监听器
    mobileCountrySelect.addEventListener('change', applyMobileFilters);
    mobileRaritySelect.addEventListener('change', applyMobileFilters);
    mobileTypeSelect.addEventListener('change', applyMobileFilters);
    mobileCommandPointSelect.addEventListener('change', applyMobileFilters);
    mobileStatusSelect.addEventListener('change', applyMobileFilters);
    mobileSettingSelect.addEventListener('change', applyMobileFilters);
    mobileSpecialSelect.addEventListener('change', applyMobileFilters);
    mobileSearchInput.addEventListener('input', applyMobileFilters);
    
    // 应用移动端筛选
    function applyMobileFilters() {
        const filters = {
            country: mobileCountrySelect.value,
            rarity: mobileRaritySelect.value,
            type: mobileTypeSelect.value,
            commandPoint: mobileCommandPointSelect.value,
            status: mobileStatusSelect.value,
            setting: mobileSettingSelect.value,
            special: mobileSpecialSelect.value,
            search: mobileSearchInput.value.trim().toLowerCase()
        };
        
        displayFilteredImages(filters);
        mobileFilterPanel.classList.remove('active');
        document.body.style.overflow = 'auto';
    }
});
        
        // 添加一个新函数用于处理包含中文的图片路径
        function encodeImagePath(path) {
            // 将路径中的每个部分进行编码，但保持分隔符不变
            return path.split('/').map(part => encodeURIComponent(part)).join('/');
        }

        // 获取所有元素引用
        const countrySelect = document.getElementById('country-select');
        const raritySelect = document.getElementById('rarity-select');
        const typeSelect = document.getElementById('type-select');
        const commandPointSelect = document.getElementById('command-point-select');
        const statusSelect = document.getElementById('status-select');
        const settingSelect = document.getElementById('setting-select');
        const specialSelect = document.getElementById('special-select'); // 新增特殊选择器
        const searchInput = document.getElementById('search-input');
        const imageDisplay = document.getElementById('image-display');

        // 页面加载时显示所有图片
        window.addEventListener('DOMContentLoaded', function() {
            loadAllImages();
            // 为所有筛选器添加事件监听器
            countrySelect.addEventListener('change', applyFilters);
            raritySelect.addEventListener('change', applyFilters);
            typeSelect.addEventListener('change', applyFilters);
            commandPointSelect.addEventListener('change', applyFilters);
            statusSelect.addEventListener('change', applyFilters);
            settingSelect.addEventListener('change', applyFilters);
            specialSelect.addEventListener('change', applyFilters); // 添加特殊选择器监听
            searchInput.addEventListener('input', applyFilters);
        });

        // 应用所有筛选条件
        function applyFilters() {
            const filters = {
                country: countrySelect.value,
                rarity: raritySelect.value,
                type: typeSelect.value,
                commandPoint: commandPointSelect.value,
                status: statusSelect.value,
                setting: settingSelect.value,
                special: specialSelect.value, // 添加特殊筛选
                search: searchInput.value.trim().toLowerCase()
            };
            
            displayFilteredImages(filters);
        }

        // 根据筛选条件显示图片
        async function displayFilteredImages(filters) {
            imageDisplay.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                // 获取卡牌数据
                const response = await fetch('data/newk.json');
                if (!response.ok) {
                    throw new Error('newk.json 网络响应错误');
                }
                const cardsData = await response.json();
                
                // 根据筛选条件过滤卡牌
                let filteredCards = cardsData.filter(card => {
                    // 处理特殊筛选（总部/卡背）
                    if (filters.special) {
                        if (card.国家 !== filters.special) {
                            return false;
                        }
                    } 
                    // 处理常规国家筛选
                    else if (filters.country && card.国家 !== filters.country) {
                        return false;
                    }
                    
                    // 稀有度筛选 - 确保进行字符串比较
                    if (filters.rarity && card.详细信息?.稀有度 !== filters.rarity) {
                        return false;
                    }
                    
                    // 类型筛选 - 确保进行字符串比较
                    if (filters.type && card.详细信息?.类型 !== filters.type) {
                        return false;
                    }
                    
                    // 指挥点筛选 - 处理7+的情况
                    if (filters.commandPoint) {
                        const cardCommandPoint = card.详细信息?.["指挥点"];
                        if (filters.commandPoint === "7+") {
                            // 7+ 选项，匹配指挥点大于等于7的卡牌
                            if (!cardCommandPoint || parseInt(cardCommandPoint) < 7) {
                                return false;
                            }
                        } else {
                            // 其他选项，精确匹配
                            if (cardCommandPoint !== filters.commandPoint) {
                                return false;
                            }
                        }
                    }
                    
                    // 状态筛选 - 确保进行字符串比较
                    if (filters.status !== "" && filters.status !== undefined) {
                        if (card.详细信息?.活跃 !== filters.status) {
                            return false;
                        }
                    }
                    
                    // 设置筛选 - 确保进行字符串比较
                    if (filters.setting && card.详细信息?.设置 !== filters.setting) {
                        return false;
                    }
                    
                    // 搜索筛选
                    if (filters.search && !card.名称.toLowerCase().includes(filters.search)) {
                        return false;
                    }
                    
                    return true;
                });
                
                // 获取对应的图片路径
                const imagesResponse = await fetch('data/newimages.json');
                if (!imagesResponse.ok) {
                    throw new Error('newimages.json 网络响应错误');
                }
                const imagesData = await imagesResponse.json();
                
                // 构建图片列表
                let imagePaths = [];
                filteredCards.forEach(card => {
                    const country = card.国家;
                    const cardName = card.名称;
                    
                    // 在图片数据中查找对应的图片
                    if (imagesData[country]) {
                        for (const subtype in imagesData[country]) {
                            const foundImage = imagesData[country][subtype].find(imgPath => 
                                imgPath.includes(cardName)
                            );
                            if (foundImage) {
                                imagePaths.push({
                                    path: foundImage,
                                    name: cardName,
                                    cardData: card
                                });
                                break;
                            }
                        }
                    }
                });
                
                // 如果是特殊筛选（总部/卡背），直接从imagesData中获取
                if (filters.special && imagesData[filters.special]) {
                    const specialData = imagesData[filters.special];
                    if (Array.isArray(specialData)) {
                        // 总部和卡背是数组格式
                        specialData.forEach(imgPath => {
                            imagePaths.push({
                                path: imgPath,
                                name: imgPath.split('/').pop()
                            });
                        });
                    }
                }
                
                if (imagePaths.length === 0) {
                    imageDisplay.innerHTML = '<div class="no-images">未找到匹配的图片</div>';
                    return;
                }
                
                renderImages(imagePaths);
                
            } catch (error) {
                console.error('加载图片出错:', error);
                imageDisplay.innerHTML = '<div class="no-images">加载图片失败</div>';
            }
        }

        // 加载所有图片并按指挥点排序
        async function loadAllImages() {
            imageDisplay.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                // 获取图片数据
                const response = await fetch('data/newimages.json');
                if (!response.ok) {
                    throw new Error('newimages.json 网络响应错误');
                }
                const imagesData = await response.json();
                
                // 收集所有图片路径
                let allImages = [];
                for (const country in imagesData) {
                    if (!imagesData.hasOwnProperty(country)) continue;
                    
                    const countryData = imagesData[country];
                    
                    // 如果国家数据是数组格式（总部、卡背等没有子类型）
                    if (Array.isArray(countryData)) {
                        countryData.forEach(imagePath => {
                            const fileName = imagePath.split('/').pop();
                            allImages.push({
                                path: imagePath,
                                name: fileName
                            });
                        });
                    } 
                    // 如果国家数据是对象格式（有子类型：金卡、银卡等）
                    else {
                        for (const subtype in countryData) {
                            if (!countryData.hasOwnProperty(subtype)) continue;
                            
                            countryData[subtype].forEach(imagePath => {
                                const fileName = imagePath.split('/').pop();
                                allImages.push({
                                    path: imagePath,
                                    name: fileName
                                });
                            });
                        }
                    }
                }
                
                if (allImages.length === 0) {
                    imageDisplay.innerHTML = '<div class="no-images">暂无图片</div>';
                    return;
                }
                
                // 按指挥点排序
                allImages = await sortImagesByCommandPoint(allImages);
                renderImages(allImages);
                
            } catch (error) {
                console.error('加载图片出错:', error);
                imageDisplay.innerHTML = '<div class="no-images">加载图片失败</div>';
            }
        }

        // 按指挥点排序图片
        async function sortImagesByCommandPoint(images) {
            try {
                // 获取卡牌数据
                const response = await fetch('data/newk.json');
                if (!response.ok) {
                    throw new Error('newk.json 网络响应错误');
                }
                const cardsData = await response.json();
                
                // 创建图片到卡牌的映射
                const imageToCardMap = {};
                images.forEach(image => {
                    const fileName = image.name;
                    // 查找匹配的卡牌数据
                    const matchingCard = cardsData.find(card => 
                        fileName.includes(card.名称)
                    );
                    if (matchingCard) {
                        imageToCardMap[fileName] = matchingCard;
                    }
                });
                
                // 按指挥点排序
                images.sort((a, b) => {
                    const cardA = imageToCardMap[a.name];
                    const cardB = imageToCardMap[b.name];
                    
                    if (!cardA && !cardB) return 0;
                    if (!cardA) return 1;
                    if (!cardB) return -1;
                    
                    const cpA = parseInt(cardA.详细信息?.["指挥点"]) || 0;
                    const cpB = parseInt(cardB.详细信息?.["指挥点"]) || 0;
                    
                    return cpA - cpB;
                });
                
                return images;
            } catch (error) {
                console.error('排序图片时出错:', error);
                return images; // 出错时返回未排序的图片
            }
        }

        // 渲染图片列表
        function renderImages(images) {
            let html = '<div class="image-container">';
            images.forEach(image => {
                // 处理图片路径
                const imagePath = typeof image === 'object' ? image.path : image;
                const encodedImagePath = encodeImagePath(imagePath);
                const fileName = imagePath.split('/').pop();
                const displayName = typeof image === 'object' ? (image.name || fileName) : fileName;
                const encodedFileName = encodeURIComponent(fileName);
                
                // 检查是否为预备卡牌
                const isReserve = typeof image === 'object' && image.cardData && 
                                 image.cardData.详细信息 && 
                                 image.cardData.详细信息.活跃 === "false";
                
                html += `
                    <div class="image-item">
                        <img src="${encodedImagePath}" alt="${displayName}" 
                             data-url="${encodedImagePath}"
                             data-filename="${encodedFileName}"
                             onload="this.parentNode.classList.add('loaded')">
                        ${isReserve ? `<img class="reserve-icon" src="image/T_nui-icon-Reserves-gritty-256.png" alt="预备">` : ''}
                    </div>
                `;
            });
            html += '</div>';
            
            imageDisplay.innerHTML = html;
            
            // 为所有图片添加触摸事件
            document.querySelectorAll('.image-item img').forEach(img => {
                // 只对非预备图标添加事件
                if (!img.classList.contains('reserve-icon')) {
                    new ImageTouchHandler(img);
                }
            });
        }

        // 图片触摸处理类
        class ImageTouchHandler {
            constructor(element) {
                this.element = element;
                this.touchStartTime = 0;
                this.touchTimer = null;
                this.touchHandled = false;
                
                this.init();
            }
            
            init() {
                // 添加触摸事件监听器
                this.element.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
                this.element.addEventListener('touchend', (e) => this.handleTouchEnd(e), { passive: false });
                this.element.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
                this.element.addEventListener('contextmenu', (e) => this.handleContextMenu(e));
            }
            
            handleTouchStart(event) {
                this.touchStartTime = Date.now();
                this.touchHandled = false;
                clearTimeout(this.touchTimer);
                
                // 长按800ms后触发下载
                this.touchTimer = setTimeout(() => {
                    if (!this.touchHandled) {
                        this.downloadImage();
                        this.touchHandled = true;
                    }
                }, 800);
            }
            
            handleTouchMove(event) {
                // 如果用户移动手指，取消长按下载
                clearTimeout(this.touchTimer);
                this.touchHandled = true;
            }
            
            handleTouchEnd(event) {
                // 如果用户提前结束触摸，取消长按下载
                clearTimeout(this.touchTimer);
                this.touchHandled = true;
            }
            
            handleContextMenu(event) {
                // 右键菜单触发下载
                event.preventDefault();
                this.downloadImage();
            }
            
   downloadImage() {
        const url = this.element.dataset.url;
        const filename = decodeURIComponent(this.element.dataset.filename);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
}

// 为了兼容性，也保留全局函数
function downloadImage(event, url, filename) {
    event.preventDefault();
    event.stopPropagation();
    
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
