.deck-footer {

    function copyToClipboard(text, button) {
  // 保存原始按钮文本
  const originalText = button.textContent;
  
  // 尝试使用现代 Clipboard API
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      // 复制成功
      button.textContent = '已复制';
      setTimeout(() => {
        button.textContent = originalText;
      }, 2000);
    }).catch(err => {
      // 复制失败，回退到传统方法
      fallbackCopyTextToClipboard(text, button, originalText);
    });
  } else {
    // 回退到传统方法
    fallbackCopyTextToClipboard(text, button, originalText);
  }
}

function fallbackCopyTextToClipboard(text, button, originalText) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  
  // 避免滚动到底部
  textArea.style.top = "0";
  textArea.style.left = "0";
  textArea.style.position = "fixed";
  textArea.style.opacity = "0";
  
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  
  try {
    const successful = document.execCommand('copy');
    if (successful) {
      button.textContent = '已复制';
      setTimeout(() => {
        button.textContent = originalText;
      }, 2000);
    } else {
      alert('复制失败，请手动复制');
    }
  } catch (err) {
    alert('复制失败，请手动复制');
  }
  
  document.body.removeChild(textArea);
}

async function loadDecks() {
  console.log('开始加载卡组数据...');
  
  const { data: decks, error: decksError } = await sb
    .from('decxfx')
    .select('*')
    .order('created_at', { ascending: false });

  if (decksError) {
    console.error('加载卡组失败:', decksError);
    document.getElementById('list').innerHTML = '<div class="no-decks">加载卡组失败</div>';
    return;
  }

  console.log('加载到的卡组数据:', decks);

  // 获取用户数据 (确保选择 id, user_name, avatar_url, admin 字段)
  const { data: users, error: usersError } = await sb
    .from('zhuce')
    .select('id, user_name, avatar_url, admin');

  if (usersError) {
    console.error('加载用户信息失败:', usersError);
    document.getElementById('list').innerHTML = '<div class="no-decks">加载用户信息失败</div>';
    return;
  }

  console.log('加载到的用户数据:', users);

  allDecks = decks;
  allUsers = users;
  
  console.log('准备渲染卡组...');
  renderDecks();
  renderPagination();
}

          }
          <div style="display:flex; flex-direction:column; line-height:1.1;">
            <span style="font-weight:bold; margin:0;">
              ${displayUser.user_name}
              ${(displayUser.admin === 0 || displayUser.admin === "0" || displayUser.admin === true) ? '<span style="color:red;font-size:12px;margin-left:5px;">[管理员]</span>' : ''}
            </span>
            <span style="color:#999; font-size:0.85em;">[${createdAt}]</span>
          </div>
        </div>

        <!-- 标题、卡组代码、留言 -->
        <div style="line-height:1.3; margin-left:48px; margin-top:2px; margin-bottom:100px;">
          <div><strong>标题:</strong> ${deck.title || '无标题'}</div>
          <div style="display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap;">
            <div><strong>卡组代码:</strong> <span id="cardcode-${deck.id}">${deck.cardcode || '无'}</span></div>
            <button class="copy-btn" onclick="copyToClipboard('${deck.cardcode}', this)" style="background-color:#f0f0f0; color:#333; border:1px solid #ddd; padding:2px 6px; border-radius:3px; font-size:12px; cursor:pointer; white-space:nowrap; width:auto;">复制代码</button>
          </div>
          <div><strong>留言:</strong> ${deck.message || '无'}</div>
        </div>

        <!-- 类型/造价/状态 -->
        <div style="font-size:0.85em; display:flex; gap:12px; margin-left:48px; justify-content:space-between; align-items:center; flex-wrap:wrap;">
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <span>类型: ${deck.type || '无'}</span>
            <span>造价: ${deck.cost || '无'}</span>
            <span>状态: ${deck.state || '无'}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

    function renderPagination() {
      const paginationElement = document.getElementById('pagination');
      const totalPages = Math.ceil(allDecks.length / DECKS_PER_PAGE);
      
      if (totalPages <= 1) {
        paginationElement.innerHTML = '';
        return;
      }
      
      let paginationHTML = '';
      
      // 首页按钮
      if (currentPage > 1) {
        paginationHTML += '<button id="first-page">首页</button>';
      }
      
      // 页码按钮
      const pageRange = 5;
      let startPage = Math.max(1, currentPage - Math.floor(pageRange/2));
      let endPage = startPage + pageRange - 1;
      
      if (endPage > totalPages) {
        endPage = totalPages;
        startPage = Math.max(1, endPage - pageRange + 1);
      }
      
      for (let i = startPage; i <= endPage; i++) {
        if (i === currentPage) {
          paginationHTML += `<button class="active">${i}</button>`;
        } else {
          paginationHTML += `<button data-page="${i}">${i}</button>`;
        }
      }
      
      // 末页按钮
      if (currentPage < totalPages) {
        paginationHTML += '<button id="last-page">末页</button>';
      }
      
      paginationHTML += `
        <div class="page-info">
          第 ${currentPage} 页，共 ${totalPages} 页
        </div>
      `;
      
      paginationElement.innerHTML = paginationHTML;
      
      // 绑定分页事件
      if (document.getElementById('first-page')) {
        document.getElementById('first-page').addEventListener('click', () => {
          currentPage = 1;
          renderDecks();
          renderPagination();
        });
      }
      
      if (document.getElementById('last-page')) {
        document.getElementById('last-page').addEventListener('click', () => {
          currentPage = totalPages;
          renderDecks();
          renderPagination();
        });
      }
      
      document.querySelectorAll('.pagination button[data-page]').forEach(button => {
        button.addEventListener('click', () => {
          currentPage = parseInt(button.dataset.page);
          renderDecks();
          renderPagination();
        });
      });
    }

    // 发布卡组功能
 async function submitDeck() {
  const title = document.getElementById('deckTitle').value.trim();
  const cardCode = document.getElementById('cardCode').value.trim();
  const message = document.getElementById('message').value.trim();
  const type = document.getElementById('type').value;
  const cost = document.getElementById('cost').value;
  const state = document.getElementById('state').value;
  
  if (!cardCode) {
    alert('请输入卡组代码');
    return;
  }
  
  const submitButton = document.getElementById('submitDeck');
  const originalText = submitButton.textContent;
  submitButton.textContent = '发布中...';
  submitButton.disabled = true;
  
  try {
    const { data, error } = await sb
      .from('decxfx')
      .insert([
        {
          user_name: currentUser.user_name, // 保存用户名而不是用户ID
          title: title,
          cardcode: cardCode,
          message: message,
          type: type,
          cost: cost,
          state: state
        }
      ]);
      
    if (error) {
      console.error('发布失败:', error);
      alert('发布失败: ' + error.message);
      return;
    }
    
    alert('卡组发布成功！');
    document.getElementById('uploadModal').style.display = 'none';
    resetForm();
    loadDecks();
  } catch (err) {
    console.error('发布过程中出错:', err);
    alert('发布过程中出错: ' + err.message);
  } finally {
    submitButton.textContent = originalText;
    submitButton.disabled = false;
  }
}
    
    // 重置表单
    function resetForm() {
      document.getElementById('deckTitle').value = '';
      document.getElementById('cardCode').value = '';
      document.getElementById('message').value = '';
      document.getElementById('type').value = '快攻';
      document.getElementById('cost').value = '平民';
      document.getElementById('state').value = '活跃';
    }
  </script>
</body>
