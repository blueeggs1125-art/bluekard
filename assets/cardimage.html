<script>
document.addEventListener('DOMContentLoaded', function() {
    const imageDisplay = document.getElementById('image-display');
    const countrySelect = document.getElementById('country-select');
    const raritySelect = document.getElementById('rarity-select');
    const typeSelect = document.getElementById('type-select');
    const commandPointSelect = document.getElementById('command-point-select');
    const statusSelect = document.getElementById('status-select');
    const settingSelect = document.getElementById('setting-select');
    const specialSelect = document.getElementById('special-select');
    const searchInput = document.getElementById('search-input');
    
     const mobileSearchInput = document.getElementById('mobile-search-input');
    if (mobileSearchInput) {
        // 添加输入事件监听
        mobileSearchInput.addEventListener('input', function() {
            applyMobileFilter();
        });
        
        // 添加回车键事件监听
        mobileSearchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                applyMobileFilter();
            }
        });
    }
    
    
function applyMobileFilter() {
    const selectedOptions = document.querySelectorAll('.tooltip-option.selected');
    const searchKeyword = mobileSearchInput ? mobileSearchInput.value.trim().toLowerCase() : '';

    const filters = {
        rarity: [],
        type: [],
        commandPoint: [],
        status: [],
        veteran: [],
        derived: [],
        country: [],
        setting: [], // 初始化设置筛选数组
        search: searchKeyword
    };

    selectedOptions.forEach(option => {
        const type = option.dataset.type;
        const value = option.dataset.value;

        switch (type) {
            case 'rarity':
                filters.rarity.push(value);
                break;
            case 'type':
                filters.type.push(value);
                break;
            case 'command-point':
                filters.commandPoint.push(value);
                break;
            case 'status':
                filters.status.push(value);
                break;
            case 'veteran':
                filters.veteran.push(value);
                break;
            case 'derived':
                filters.derived.push(value);
                break;
            case 'country':
                filters.country.push(value);
                break;
            case 'setting': // 处理设置筛选
                filters.setting.push(value); // 确保设置值被加入
                console.log('选中的设置值:', value); // 调试输出
                break;
        }
    });

    // 新增：显式提示空筛选条件
    if (filters.setting.length === 0) {
        console.warn('未选中任何设置筛选条件');
    }

    console.log('移动端筛选条件:', filters); // 调试输出
    filterImagesByMobile(filters);
}


    loadInitialImages();
    
  
    const cardbackIcon = document.getElementById('cardback-icon');
    const headquartersIcon = document.getElementById('headquarters-icon');
    
    if (cardbackIcon) {
        cardbackIcon.addEventListener('click', function() {
            // 清除所有选中状态
            document.querySelectorAll('.tooltip-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            // 显示卡背图片
            displaySpecialImages('卡背');
        });
    }
    
    if (headquartersIcon) {
        headquartersIcon.addEventListener('click', function() {
            // 清除所有选中状态
            document.querySelectorAll('.tooltip-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            // 显示总部图片
            displaySpecialImages('总部');
        });
    }
    
    // 桌面版筛选器事件 - 改为多选支持
    countrySelect.addEventListener('change', function() {
        updateFilter('country', this.value);
        applyFilters();
    });
    raritySelect.addEventListener('change', function() {
        updateFilter('rarity', this.value);
        applyFilters();
    });
    typeSelect.addEventListener('change', function() {
        updateFilter('type', this.value);
        applyFilters();
    });
    commandPointSelect.addEventListener('change', function() {
        updateFilter('command-point', this.value);
        applyFilters();
    });
    statusSelect.addEventListener('change', function() {
        updateFilter('status', this.value);
        applyFilters();
    });
    settingSelect.addEventListener('change', function() {
        updateFilter('setting', this.value);
        applyFilters();
    });
    specialSelect.addEventListener('change', function() {
        if (this.value) {
            displaySpecialImages(this.value);
        } else {
            // 如果没有选择特殊分类，显示所有图片
            loadInitialImages();
        }
    });
    searchInput.addEventListener('input', applyFilters);
    
    // 加载初始图片（所有普通卡牌图片，不包括总部、卡背、衍生、老兵）
function loadInitialImages() {
    imageDisplay.innerHTML = '<div class="loading">加载中...</div>';
    
    // 并行获取卡牌数据和图片数据
    Promise.all([
        fetch('../data/newk.json').then(response => response.json()),
        fetch('../data/newimages.json').then(response => response.json())
    ])
    .then(([cardsData, imagesData]) => {
        // 创建卡牌和图片的映射关系
        const cardImageMap = createCardImageMap(cardsData, imagesData);
        
        // 按指挥点排序
        const sortedCards = sortCardsByCommandPoint(cardImageMap);
        
        // 只提取图片信息，但保留 cardData 用于判断是否为预备卡牌
        const allImages = sortedCards.map(item => ({
            path: item.imagePath,
            name: item.imagePath.split('/').pop(),
            cardData: item.card // 保留 cardData 信息
        }));
        
        renderImages(allImages);
    })
    .catch(error => {
        console.error('加载图片出错:', error);
        imageDisplay.innerHTML = '<div class="no-images">加载图片失败</div>';
    });
}

    
   
   function createCardImageMap(cardsData, imagesData) {
    const cardImageMap = [];

    cardsData.forEach(card => {
        const country = card.国家;
        const cardName = card.名称;

        if (imagesData[country]) {
            for (const subtype in imagesData[country]) {
                
                const foundImage = imagesData[country][subtype].find(imgPath => {
                    const fileName = imgPath.split('/').pop().replace(/\.[^/.]+$/, ""); 
                    return fileName === cardName; 
                });

                if (foundImage) {
                    cardImageMap.push({
                        card: card,
                        imagePath: foundImage
                    });
                    break;
                }
            }
        }
    });

    return cardImageMap;
}
    
    // 按指挥点排序卡牌
    function sortCardsByCommandPoint(cards) {
        return cards.sort((a, b) => {
            const cpA = parseInt(a.card.详细信息?.["指挥点"]) || 0;
            const cpB = parseInt(b.card.详细信息?.["指挥点"]) || 0;
            return cpA - cpB;
        });
    }
    
    // 更新筛选器函数（支持多选）
function updateFilter(type, value) {
    let selectElement;
    switch(type) {
        case 'country':
            selectElement = document.getElementById('country-select');
            break;
        case 'rarity':
            selectElement = document.getElementById('rarity-select');
            break;
        case 'type':
            selectElement = document.getElementById('type-select');
            break;
        case 'command-point':
            selectElement = document.getElementById('command-point-select');
            break;
        case 'status':
            selectElement = document.getElementById('status-select');
            break;
        case 'setting':
            selectElement = document.getElementById('setting-select');
            break;
    }

    if (selectElement) {
        const currentValues = selectElement.value ? selectElement.value.split(',') : [];
        const valueIndex = currentValues.indexOf(value);

        if (valueIndex > -1) {
            currentValues.splice(valueIndex, 1); // 移除已选中项
        } else {
            currentValues.push(value); // 添加新选中项
        }

        selectElement.value = currentValues.join(',');
        syncMobileFilters(type, selectElement.value); // 同步移动端
        applyFilters(); // 应用筛选
    }
}
    
    // 应用筛选条件
    function applyFilters() {
        const filters = {
            country: countrySelect.value ? countrySelect.value.split(',') : [],
            rarity: raritySelect.value ? raritySelect.value.split(',') : [],
            type: typeSelect.value ? typeSelect.value.split(',') : [],
            commandPoint: commandPointSelect.value ? commandPointSelect.value.split(',') : [],
            status: statusSelect.value ? statusSelect.value.split(',') : [],
            setting: settingSelect.value ? settingSelect.value.split(',') : [],
            special: specialSelect.value,
            search: searchInput.value.trim().toLowerCase()
        };
        
        if (filters.special) {
            displaySpecialImages(filters.special);

    function hasActiveFilters(filters) {
        return filters.country.length > 0 || filters.rarity.length > 0 || filters.type.length > 0 || 
               filters.commandPoint.length > 0 || filters.status.length > 0 || filters.setting.length > 0 || 
               filters.search;
    }

                    const fileName = imgPath.split('/').pop().replace(/\.[^/.]+$/, "");

                        path: imgPath,
                        name: fileName
                    };

function renderImages(images) {
    let html = '<div class="image-container">';
    images.forEach(image => {
        const imagePath = typeof image === 'object' ? image.path : image;
        // 自动添加 ../ 前缀以适应 assets 文件夹的位置
        let correctedImagePath = imagePath;
        if (!imagePath.startsWith('http') && !imagePath.startsWith('../')) {
            correctedImagePath = '../' + imagePath;
        }
        const encodedImagePath = encodeImagePath(correctedImagePath);
        const fileName = imagePath.split('/').pop();
        const displayName = typeof image === 'object' ? (image.name || fileName) : fileName;
        const encodedFileName = encodeURIComponent(fileName);

        html += `
            <div class="image-item">
                <img src="${encodedImagePath}" alt="${displayName}" 
                     data-url="${encodedImagePath}"
                     data-filename="${encodedFileName}"
                     onload="this.parentNode.classList.add('loaded')"
                     style="cursor: pointer;">
                <div class="image-name">${displayName}</div>
            </div>
        `;
    });
    html += '</div>';

    imageDisplay.innerHTML = html;
}

function syncMobileFilters(type, value) {
    // 清除移动端所有同类选项的选中状态
    document.querySelectorAll(`.tooltip-option[data-type="${type}"]`).forEach(opt => {
        opt.classList.remove('selected');
    });

    // 设置新选中项
    if (value) {
        const values = value.split(',');
        values.forEach(val => {
            const selectedOption = document.querySelector(`.tooltip-option[data-type="${type}"][data-value="${val}"]`);
            if (selectedOption) {
                selectedOption.classList.add('selected');
            }
        });
    }
}
    



function encodeImagePath(path) {
   
    if (path.startsWith('../')) {

        const parts = path.split('/');
        return parts.map((part, index) => {
  
            if (index === 0) return part;
            return encodeURIComponent(part);
        }).join('/');
    } else if (path.startsWith('http')) {
  
        return path;
    } else {
      
        const parts = path.split('/');
        return '../' + parts.map(part => encodeURIComponent(part)).join('/');
    }
}
