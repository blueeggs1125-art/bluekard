<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="16x16" href="../icon/16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icon/32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../icon/48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="../icon/64x64.png">
    <link rel="icon" type="image/png" sizes="128x128" href="../icon/128x128.png">
    <link rel="icon" type="image/png" sizes="256x256" href="../icon/256x256.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../icon/512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../icon/180x180.png">
    <link rel="stylesheet" href="../css/assets/sound/sound.css">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <title>FUCK 1939</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }
        
     
        .category-selector {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .category-selector select {
            padding: 8px 15px;
            font-size: 16px;
            border: 2px solid #1e90ff;
            border-radius: 5px;
            background-color: white;
            color: #333;
            cursor: pointer;
            margin: 0 5px;
        }
        
        .sound-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        
        .sound-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background-color: white;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .sound-item:hover {
            transform: scale(1.05);
        }
        
        .sound-item .sound-name {
            padding: 10px;
            font-size: 14px;
            text-align: center;
            color: #333;
            word-break: break-word;
        }
        
        .no-sounds {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-style: italic;
            grid-column: 1 / -1;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            grid-column: 1 / -1;
        }
        
     
        .nav-link {
            display: block;
            text-align: center;
            margin: 15px 0;
            color: #1e90ff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .nav-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            
            .sound-container {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
            
            h1 {
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .sound-container {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }
            
            .sound-item .sound-name {
                font-size: 12px;
                padding: 5px;
            }
        }
        
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
       
        <div class="category-selector">
            <select id="primary-category-select">
                <option value="all">全部音效</option>
            </select>
            <select id="secondary-category-select" style="display: none;">
                <option value="">选择二级分类</option>
            </select>
        </div>
        
        <div id="sound-display">
            <div class="loading">加载中...</div>
        </div>
    </div>
    <style>
        .container {
            padding-bottom: 60px; 
        }
    </style>

    <audio id="audio-player"></audio>
    <script src="../js/daohanglan2.js"></script>
    <script>
let soundFiles = [];

document.addEventListener('DOMContentLoaded', initSoundPage);

async function initSoundPage() {
    const soundDisplay = document.getElementById('sound-display');
    
    try {
        const response = await fetch('../sound/files.json');
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        soundFiles = await response.json();
        
        if (soundFiles.length === 0) {
            soundDisplay.innerHTML = '<div class="no-sounds">暂无音效文件</div>';
            return;
        }
        
        const audioExtensions = ['.mp3', '.wav', '.ogg', '.m4a', '.flac', '.aac', '.wma', '.opus'];
        const audioSounds = soundFiles.filter(sound => 
            audioExtensions.some(ext => sound.toLowerCase().endsWith(ext))
        );
        
        if (audioSounds.length === 0) {
            soundDisplay.innerHTML = '<div class="no-sounds">暂无音频文件</div>';
            return;
        }
        
       
        const filteredSounds = audioSounds.filter(sound => {
            const pathParts = sound.split('/');
            if (pathParts.length >= 3 && pathParts[0] === '..' && pathParts[1] === 'sound') {
                const primaryCategory = pathParts[2];
                return primaryCategory !== '其他'; 
            }
            return true;
        });
        
        createMultiLevelCategorySelector(filteredSounds);
        
        displaySounds(filteredSounds);
        
    } catch (error) {
        console.error('加载音效出错:', error);
        soundDisplay.innerHTML = '<div class="no-sounds">加载音效失败</div>';
    }
}

function createMultiLevelCategorySelector(sounds) {
    const categoryStructure = {};
    const hasSubfolders = {};
    
    sounds.forEach(sound => {
        const pathParts = sound.split('/');
        
        if (pathParts.length >= 3 && pathParts[0] === '..' && pathParts[1] === 'sound') {
            const primaryCategory = pathParts[2];
            const secondaryCategory = pathParts.length > 3 ? pathParts[3] : '';
            
            if (!categoryStructure[primaryCategory]) {
                categoryStructure[primaryCategory] = new Set();
            }
            
            if (secondaryCategory) {
                categoryStructure[primaryCategory].add(secondaryCategory);
                hasSubfolders[primaryCategory] = true;
            } else {
                hasSubfolders[primaryCategory] = hasSubfolders[primaryCategory] || false;
            }
        }
    });

    const primarySelect = document.getElementById('primary-category-select');
    
    Object.keys(categoryStructure).sort().forEach(primaryCat => {
        const option = document.createElement('option');
        option.value = primaryCat;
        option.textContent = primaryCat;
        primarySelect.appendChild(option);
    });

    const secondarySelect = document.getElementById('secondary-category-select');
    
    primarySelect.addEventListener('change', function() {
        const selectedPrimary = this.value;
        secondarySelect.innerHTML = '<option value="">选择二级分类</option>';
        
       
        if (selectedPrimary === '单位' && categoryStructure[selectedPrimary] && hasSubfolders[selectedPrimary]) {
            secondarySelect.style.display = 'inline-block';
         
            Array.from(categoryStructure[selectedPrimary]).sort().forEach(secondaryCat => {
                const option = document.createElement('option');
                option.value = secondaryCat;
                option.textContent = secondaryCat;
                secondarySelect.appendChild(option);
            });
        } else {
           
            secondarySelect.style.display = 'none';
        }
        
        filterSoundsByMultiLevelCategory(sounds, selectedPrimary, secondarySelect.value);
    });
    
    secondarySelect.addEventListener('change', function() {
        const primarySelect = document.getElementById('primary-category-select');
        filterSoundsByMultiLevelCategory(sounds, primarySelect.value, this.value);
    });
}

function filterSoundsByMultiLevelCategory(sounds, primaryCategory, secondaryCategory) {
    let filteredSounds = sounds;
    
    if (primaryCategory !== 'all') {
        filteredSounds = filteredSounds.filter(sound => {
            const pathParts = sound.split('/');
            
            if (pathParts.length >= 3 && pathParts[0] === '..' && pathParts[1] === 'sound') {
                if (secondaryCategory) {
                    return pathParts[2] === primaryCategory && pathParts[3] === secondaryCategory;
                } else {
                    return pathParts[2] === primaryCategory;
                }
            }
            return false;
        });
    }
    
    displaySounds(filteredSounds);
}

function displaySounds(sounds) {
    const soundDisplay = document.getElementById('sound-display');
    
    if (sounds.length === 0) {
        soundDisplay.innerHTML = '<div class="no-sounds">该分类下暂无音效文件</div>';
        return;
    }
    
    let html = '<div class="sound-container">';
    sounds.forEach(sound => {
        const fileName = getFileNameWithoutExtension(sound);
        html += `
            <div class="sound-item" 
                 data-src="${sound}" 
                 data-filename="${sound.split('/').pop()}">
                <div class="sound-name">${fileName}</div>
            </div>
        `;
    });
    html += '</div>';
    
    soundDisplay.innerHTML = html;

    document.querySelectorAll('.sound-item').forEach(item => {
        item.addEventListener('click', () => {
            playSound(item.getAttribute('data-src'));
        });
        
        item.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            downloadSound(event, item.getAttribute('data-src'), item.getAttribute('data-filename'));
        });
        
        item.addEventListener('touchstart', (event) => {
            handleTouchStart(event, item.getAttribute('data-src'), item.getAttribute('data-filename'));
        });
        
        item.addEventListener('touchend', handleTouchEnd);
        item.addEventListener('touchmove', handleTouchMove);
    });
}

function getFileNameWithoutExtension(filePath) {
    const fileName = filePath.split('/').pop();
    const audioExtensions = ['.mp3', '.wav', '.ogg', '.m4a', '.flac', '.aac', '.wma', '.opus'];
    
    for (const ext of audioExtensions) {
        if (fileName.toLowerCase().endsWith(ext)) {
            return fileName.replace(new RegExp(ext + '$', 'i'), '');
        }
    }
    return fileName; 
}

function playSound(src) {
    const audioPlayer = document.createElement('audio'); 
    audioPlayer.src = src;
    audioPlayer.play().catch(e => {
        console.error('播放音频出错:', e);
    });
}

function downloadSound(event, url, filename) {
    event.preventDefault();
    
    const link = document.createElement('a');
    link.href = url;
    
    link.download = decodeURIComponent(filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

let longPressTimer;

function handleTouchStart(event, url, filename) {
    longPressTimer = setTimeout(() => {
        downloadSound(event, url, filename);
    }, 1000); 
}

function handleTouchEnd() {
    clearTimeout(longPressTimer);
}

function handleTouchMove() {
    clearTimeout(longPressTimer);
}
    </script>

<style>
    @keyframes pageSlideIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .container {
        animation: pageSlideIn 0.4s ease-out forwards;
    }

    .content {
        animation: pageSlideIn 0.4s ease-out forwards;
    }

    .video-list {
        animation: pageSlideIn 0.4s ease-out forwards;
    }

    #sound-display {
        animation: pageSlideIn 0.4s ease-out forwards;
    }

    #image-display {
        animation: pageSlideIn 0.4s ease-out forwards;
    }

    .bottom-nav {
        animation: pageSlideIn 0.4s ease-out 0.1s forwards;
        animation-fill-mode: both;
    }

    .container,
    .content,
    .video-list,
    #sound-display,
    #image-display,
    .bottom-nav {
        opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
        .container,
        .content,
        .video-list,
        #sound-display,
        #image-display,
        .bottom-nav {
            animation: none;
            opacity: 1;
        }
    }
</style>

</body>
</html>
